name: pasto-bacano
language: en
domain_module: domain
engine: agno
prompts_dir: domain/prompts
# Sources of candidate property polygons, in priority order (see README, "Adapting Pasto10 to your country").
property_sources: [demo_registry, osm]
channels: [streamlit, whatsapp]
features:
  tts: true
  interaction-assessment: true
  summarization: true
  guardrails: true
  terms-acceptance:
    enable: true
    file: domain/terms.md
# No "models" block: every agent takes its model from the environment
# (PRIMARY_MODEL_PROVIDER, PRIMARY_MODEL_ID and optional FALLBACK_MODEL_*),
# so the model can be changed per deployment without editing this file.
