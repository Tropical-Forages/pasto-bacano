# Environment of the pasto-bacano Cloud Run service (the Streamlit chat for testers).
# Used with: gcloud run deploy pasto-bacano ... --env-vars-file deploy/streamlit.env.yaml
# No secrets here: Vertex AI uses the service account.
APP_ENV: "development"
GEE_PROJECT: "time2graze-tests"

# Model used by every agent. Change the ID and redeploy to switch models.
PRIMARY_MODEL_PROVIDER: "google"
PRIMARY_MODEL_ID: "gemini-3.5-flash-lite"

# Models run on Vertex AI (billed to the project, uses the service account; no key).
# To go back to a Gemini API key: delete these four lines and add
# --set-secrets GOOGLE_API_KEY=gemini-api-key:latest to the deploy command.
GOOGLE_GENAI_USE_VERTEXAI: "true"
GOOGLE_CLOUD_PROJECT: "time2graze-tests"
GOOGLE_CLOUD_LOCATION: "global"
GOOGLE_API_KEY: "unused"
